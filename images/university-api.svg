<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="800" height="500" fill="#0b1623"/><rect width="800" height="44" fill="#101f31"/><circle cx="20" cy="22" r="5" fill="#ff6877"/><circle cx="38" cy="22" r="5" fill="#ffc45b"/><circle cx="56" cy="22" r="5" fill="#45d99a"/><rect x="250" y="12" width="300" height="20" rx="10" fill="#0b1623"/><text x="400" y="26" fill="#6f8aa6" font-size="10" text-anchor="middle">localhost:5001/swagger/index.html</text>
<text x="30" y="88" fill="#eaf3ff" font-size="22" font-weight="800">University API</text><rect x="178" y="70" width="34" height="18" rx="9" fill="#27dfa1"/><text x="195" y="83" fill="#06211a" font-size="10" font-weight="700" text-anchor="middle">v1</text><text x="30" y="108" fill="#9db0c7" font-size="11">ASP.NET Core Web API · Students, Courses, Enrollments, Grades &amp; Professors</text>
<g font-size="12" font-family="ui-monospace,Menlo,monospace"><text x="30" y="146" fill="#eaf3ff" font-family="Inter,Arial" font-weight="700" font-size="13">Students</text>
<rect x="30" y="156" width="740" height="30" rx="6" fill="#0f3a2f" stroke="#27dfa1"/><rect x="30" y="156" width="70" height="30" rx="6" fill="#27dfa1"/><text x="65" y="176" fill="#06211a" font-weight="700" text-anchor="middle">GET</text><text x="115" y="176" fill="#eaf3ff">/api/students</text><text x="760" y="176" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">List all students</text>
<rect x="30" y="192" width="740" height="30" rx="6" fill="#0d2d4d" stroke="#1597ff"/><rect x="30" y="192" width="70" height="30" rx="6" fill="#1597ff"/><text x="65" y="212" fill="#fff" font-weight="700" text-anchor="middle">POST</text><text x="115" y="212" fill="#eaf3ff">/api/students</text><text x="760" y="212" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">Register a student</text>
<text x="30" y="254" fill="#eaf3ff" font-family="Inter,Arial" font-weight="700" font-size="13">Courses</text>
<rect x="30" y="264" width="740" height="30" rx="6" fill="#0f3a2f" stroke="#27dfa1"/><rect x="30" y="264" width="70" height="30" rx="6" fill="#27dfa1"/><text x="65" y="284" fill="#06211a" font-weight="700" text-anchor="middle">GET</text><text x="115" y="284" fill="#eaf3ff">/api/courses/{id}</text><text x="760" y="284" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">Get course details</text>
<rect x="30" y="300" width="740" height="30" rx="6" fill="#3d3010" stroke="#f3c879"/><rect x="30" y="300" width="70" height="30" rx="6" fill="#f3c879"/><text x="65" y="320" fill="#3a2a00" font-weight="700" text-anchor="middle">PUT</text><text x="115" y="320" fill="#eaf3ff">/api/courses/{id}</text><text x="760" y="320" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">Update course</text>
<text x="30" y="362" fill="#eaf3ff" font-family="Inter,Arial" font-weight="700" font-size="13">Enrollments &amp; Grades</text>
<rect x="30" y="372" width="740" height="30" rx="6" fill="#0d2d4d" stroke="#1597ff"/><rect x="30" y="372" width="70" height="30" rx="6" fill="#1597ff"/><text x="65" y="392" fill="#fff" font-weight="700" text-anchor="middle">POST</text><text x="115" y="392" fill="#eaf3ff">/api/enrollments</text><text x="760" y="392" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">Enroll in a course</text>
<rect x="30" y="408" width="740" height="30" rx="6" fill="#3d3010" stroke="#f3c879"/><rect x="30" y="408" width="70" height="30" rx="6" fill="#f3c879"/><text x="65" y="428" fill="#3a2a00" font-weight="700" text-anchor="middle">PUT</text><text x="115" y="428" fill="#eaf3ff">/api/grades/{studentId}</text><text x="760" y="428" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">Submit grade</text>
<rect x="30" y="444" width="740" height="30" rx="6" fill="#3d1520" stroke="#ff6877"/><rect x="30" y="444" width="70" height="30" rx="6" fill="#ff6877"/><text x="65" y="464" fill="#fff" font-weight="700" text-anchor="middle">DEL</text><text x="115" y="464" fill="#eaf3ff">/api/professors/{id}</text><text x="760" y="464" fill="#9db0c7" font-family="Inter,Arial" font-size="10" text-anchor="end">Remove professor</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
